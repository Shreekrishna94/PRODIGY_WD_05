<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrii's Weather App</title>
    <link rel="stylesheet" href="styled.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Shrii's Weather App</h1><br>
        <h2> Find your city weather deails here!</h2><br>
        <input type="text" id="cityInput" placeholder="Enter your city" />
        <button id="searchBtn">Search</button>

        <div id="weatherInfo">
            <h2 id="cityName">City Name</h2>
            <p id="temp"></p>
            <p id="description"></p>
            <p id="humidity"></p>
            <p id="windSpeed"></p>
        </div>
    </div>

    <script src="scripted.js"></script>
</body>
</html>
